# Runs both variants' test suites on every push and pull request (R-WEB-005.C3).
# pages.yml (publish) and release.yml (PyPI) run their own Python tests; this workflow publishes nothing.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install -e "python[markdown]"
          python -m pip install -r python/examples/site/requirements.txt
      - name: Role catalogue fixture is current (REF.2 on the docs branch)
        run: |
          git fetch --depth=1 origin docs:refs/remotes/origin/docs
          python python/tools/gen_role_catalogue.py --check
      - name: Test (with the real Zensical build, IT-5)
        working-directory: python
        run: ZENSICAL="$(command -v zensical)" python -m unittest discover -s tests -t .
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: typescript }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test (build, node --test, Playwright in Chromium)
        run: npm test
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: typescript/playwright-report/, if-no-files-found: ignore }
