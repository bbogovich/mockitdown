# Publishes GitHub Pages: the documentation site (docs branch) at /, the demo (example) site at /demos/,
# the pack gallery (typescript/pages/ of main, R-WEB-004.C27-C31) at /gallery/.
# Runs the tests first; the example site build is itself a test (strict mockitdown errors fail it), and
# the assembled site is served and checked in Chromium before it is uploaded (R-WEB-004 TC-9).
# The same file is on main and docs (a push runs the copy on the pushed branch): change both.
name: pages
on:
  push:
    branches: [main, docs]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/checkout@v4
        with: { ref: docs, path: docs }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: main/typescript/package-lock.json
      - name: Install
        run: |
          python -m pip install -e "main/python[markdown]"
          python -m pip install -r main/python/examples/site/requirements.txt -r docs/requirements.txt
      - name: Test
        working-directory: main/python
        run: python -m unittest discover -s tests -t .
      - name: Build documentation (docs branch)
        working-directory: docs
        run: zensical build --clean
      - name: Build example site
        working-directory: main/python/examples/site
        run: zensical build --clean
      - name: Build the web components (pack gallery)
        working-directory: main/typescript
        run: |
          npm ci
          npm run build
      - name: Assemble
        run: |
          mkdir -p public
          cp -R docs/site/. public/
          mkdir -p public/demos && cp -R main/python/examples/site/site/. public/demos/
          # The site has no top-level page: send / to the first header tab, Demo.
          if [ ! -f public/index.html ]; then
            printf '<!doctype html><meta charset="utf-8"><title>mockitdown</title><meta http-equiv="refresh" content="0; url=demos/"><link rel="canonical" href="demos/"><a href="demos/">mockitdown</a>\n' > public/index.html
          fi
          # The pack gallery in the development server's URL layout: gallery/pages, dist, shared.
          node main/typescript/scripts/assemble-gallery.mjs public/gallery
      - name: Test the published site
        working-directory: main/typescript
        run: |
          npx playwright install --with-deps chromium
          python -m http.server 8174 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/public" > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8174/gallery/ && break; sleep 1; done
          GALLERY_URL=http://127.0.0.1:8174/gallery/ npx playwright test -c playwright.published.config.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
