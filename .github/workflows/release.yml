# Publishes mockitdown to PyPI when a version tag (v0.1.0, …) is pushed.
# The Python package is in python/ (R-REPO-003.C4); its build copies the shared/ assets into it.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored. One-time setup on pypi.org:
#   Account → Publishing → Add a pending publisher: project "mockitdown", owner "bbogovich",
#   repository "mockitdown", workflow "release.yml", environment "pypi".
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check the tag matches the package version
        working-directory: python
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: Test
        working-directory: python
        run: |
          python -m pip install -e ".[markdown]"
          python -m unittest discover -s tests -t .
      - name: Build sdist and wheel
        working-directory: python
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: python/dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/project/mockitdown/" }
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
