# mockitdown example site — one page per design pack, built with Zensical (or MkDocs).
# Every page is also a test fixture: tests/test_examples.py renders each block and fails on errors.
site_name: mockitdown examples
site_url: https://bbogovich.github.io/mockitdown/demos/
repo_url: https://github.com/bbogovich/mockitdown
site_description: UI mockups written in SwiftUI syntax, rendered in the style of each UI framework.
docs_dir: docs

theme:
  name: material
  variant: classic
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - assets/site.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - mockitdown:
      default_pack: base
      default_appearance: auto
      import_paths: [docs/mockups]
      asset_paths: [docs]
      strict: true
  - pymdownx.superfences:
      custom_fences:
        - name: mockitdown
          class: mockitdown
          format: !!python/name:mockitdown.fence.format
          validator: !!python/name:mockitdown.fence.validate

nav:
  - Home: index.md
  - Language tour: tour.md
  - Custom components: components.md
  - Annotations and overlays: annotations.md
  - Beyond the framework kits: widgets.md
  - Charts: charts.md
  - Packs:
      - SwiftUI: packs/swiftui.md
      - Fluent (WinUI 3): packs/fluent.md
      - Material UI (React): packs/mui.md
      - Angular Material: packs/angular-material.md
      - SAPUI5 (Fiori): packs/sapui5.md
      - Bootstrap: packs/bootstrap.md
      - shadcn/ui: packs/shadcn.md
      - Android (Material 3): packs/android.md
      - GTK 4 (libadwaita): packs/gtk.md
      - Qt 6 (Fusion): packs/qt.md
      - KDE Plasma (Breeze): packs/kde-plasma.md
  - Retro:
      - Macintosh (System 1–6): retro/mac-classic.md
      - Lisa Office System: retro/lisa.md
      - Mac OS 9 (Platinum): retro/macos9.md
      - Apple IIgs GS/OS: retro/gsos.md
      - Xerox Star: retro/xerox-star.md
      - Windows 2.x: retro/win2.md
      - Windows 3.1.1: retro/win31.md
      - Windows XP (Luna): retro/winxp.md
      - Windows Vista (Aero): retro/vista.md
      - Solaris CDE: retro/cde.md
  - Recommended next packs: roadmap.md
