# GENERATED by tools/sio_docs.py build from site.yml — edit that file, not this one.
site_name: mockitdown
site_description: The mockitdown definition.
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Definition:
      - Home: definition/index.md
      - Change history: definition/meta/change-history.md
  - Specification:
      - Home: specification/index.md
      - Change history: specification/meta/change-history.md
  - Implementation:
      - Home: implementation/index.md
      - Architecture: implementation/architecture/index.md
