# GENERATED by vio-docs build from site.yml — edit that file, not this one.
site_name: mockitdown
site_url: https://bbogovich.github.io/mockitdown/
repo_url: https://github.com/bbogovich/mockitdown
site_description: UI mockups written in SwiftUI syntax inside Markdown, rendered as HTML styled after real UI frameworks — definition, specification and implementation.
docs_dir: docs

# Built with Zensical (ADR-14): `zensical build` reads the generated copy of this file, mkdocs.yml.
# The classic variant keeps the Material look (coloured header); Zensical defaults to "modern".
theme:
  name: material
  variant: classic
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

# Zensical does not inject the Mermaid runtime; this loader renders the mermaid fences.
extra_css:
  - specification/stylesheets/tabs.css

extra_javascript:
  - specification/javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.details
  # mockitdown renders the live mockups on the specification pages. It is installed from the
  # main repository (pip install -e ../mockitdown/python). Paths are relative to this directory.
  - mockitdown:
      default_pack: base
      default_appearance: auto
      import_paths: [docs/specification/mockups]
      asset_paths: [docs/specification]
      strict: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: mockitdown
          class: mockitdown
          format: !!python/name:mockitdown.fence.format
          validator: !!python/name:mockitdown.fence.validate

