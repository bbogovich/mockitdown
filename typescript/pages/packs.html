<!doctype html>
<html lang="en" data-appearance="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pack gallery</title>
  <link rel="stylesheet" href="packs.css">
  <script type="module" src="packs.js"></script>
</head>
<body>
  <!-- The pack gallery (R-WEB-004): the packs of shared/reference/index.json in a side panel, the
       selected pack's elements (shared/reference/<pack>.json) and the design patterns of
       shared/patterns/ in the main area. Mockups are created as they come near the viewport. -->
  <header class="bar">
    <button id="menu" type="button" aria-controls="packs" aria-expanded="false">☰ Packs</button>
    <a class="brand" href="./">mockitdown</a>
    <span class="brand-sub">Pack gallery</span>
    <span class="spacer"></span>
    <label class="field">
      <span class="sr-only">Filter elements by name</span>
      <input id="filter" type="search" placeholder="Filter elements…" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span>Appearance</span>
      <select id="appearance">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </header>

  <div class="layout">
    <nav id="packs" aria-label="Packs"></nav>
    <main id="main" tabindex="-1">
      <p class="loading">Loading packs…</p>
    </main>
  </div>
</body>
</html>
